# Emergent Runtime Configuration
# Non-secret settings. Secrets go in .env

agent:
  provider: "anthropic"         # "anthropic" | "openai" | "gemini" | "ollama"
  model: "claude-sonnet-4-20250514"
  routing_enabled: true
  fast_provider: "anthropic"
  fast_model: "claude-haiku-4-5-20251001"
  strong_provider: "anthropic"
  strong_model: "claude-sonnet-4-20250514"
  summary_provider: "anthropic" # "anthropic" | "openai" | "gemini" | "ollama"
  haiku_model: "claude-haiku-4-5-20251001"
  ollama_base_url: "http://127.0.0.1:11434"
  max_tokens: 4096

  # Cost budgets (USD per session)
  cost_budget_soft_usd: 0.50    # warning in logs + dashboard
  cost_budget_hard_usd: 2.00    # cuts the session (raises error)

  # Fallback providers — ordered list, tried after primary fails with fatal error
  fallback_providers: ["openai", "gemini"]
  # Fallback models — which model to use for each fallback provider
  fallback_models:
    openai: "gpt-4o-mini"
    gemini: "gemini-2.0-flash"

  # Routing mode: "heuristic" (keyword-based) | "llm_judge" (LLM classifier) | "disabled"
  routing_mode: "heuristic"
  # routing_classifier_provider: ""  # default: agent.provider
  # routing_classifier_model: ""     # default: haiku_model

  # Guards — hardcoded, NOT overridable by the agent
  # These values are used by verify_guards_integrity() at startup
  max_iterations: 15
  max_tokens_session: 100000
  timeout_per_tool_seconds: 30
  timeout_session_seconds: 300
  max_tool_output_chars: 10000
  confirmation_timeout_seconds: 60

system_prompt: |
  Sos Emergent, un agente autónomo personal corriendo en el sistema local de tu dueño.
  Tenés acceso a herramientas para ejecutar comandos de shell, leer y escribir archivos,
  obtener información del sistema, buscar en la web, y gestionar tu memoria.

  Principios:
  - Sé conciso y directo. El usuario te habla desde Telegram.
  - Antes de ejecutar comandos destructivos, explicá qué vas a hacer.
  - Usa tu memoria para recordar preferencias y contexto previo.
  - Si no podés hacer algo por seguridad, explicá por qué claramente.
  - Respondé en el mismo idioma que el usuario.

tools:
  shell:
    enabled: true
    default_timeout: 30
  files:
    enabled: true
    sandbox_root: "~"  # all paths relative to $HOME
  web:
    enabled: true
    timeout: 15
    max_chars: 10000
  system_info:
    enabled: true
    cache_ttl_seconds: 30
  memory:
    enabled: true
  cron:
    enabled: true
    min_interval_minutes: 5

memory:
  data_dir: "./data"
  sqlite_db: "emergent.db"
  chroma_dir: "chroma"
  conversation_ttl_days: 90
  trace_ttl_days: 30
  summarize_at_pct: 0.80  # trigger summarization at 80% of context budget
  context_budget_tokens: 20000
  max_history_turns: 12  # fetch fewer past turns to reduce token burn
  history_keep_after_summary: 4  # keep only the latest turns after summarizing

observability:
  log_level: "INFO"
  log_format: "json"  # "json" | "console"
  metrics_retention_days: 30
  alert_success_rate_critical: 0.75
  alert_p95_latency_critical: 60
  alert_cost_per_request_warning: 0.08

voice:
  enabled: true
  # Legacy keyboard settings (deprecated; /voice and /voice-off are preferred)
  ptt_key: "right ctrl"
  # Optional legacy physical key by scan code
  # ptt_scan_code: 115
  sample_rate: 16000
  channels: 1
  max_record_seconds: 15
  # Continuous voice mode endpointing
  vad_mode: 2
  min_speech_ms: 250
  silence_end_ms: 700
  max_utterance_seconds: 20
  stt_model: "small"
  stt_device: "cpu"
  stt_compute_type: "int8"
  stt_language: "es"
  tts_enabled: false
  tts_command: "piper"
  # Absolute path to Piper .onnx voice model
  tts_model_path: ""
  # Optional for multi-speaker models
  # tts_speaker_id: 0
  tts_length_scale: 1.0
  tts_noise_scale: 0.667
  tts_noise_w: 0.8
  tts_sentence_silence: 0.15
  tts_max_chars: 500
  ui_beep: false

research:
  enabled: true
  schedule: "30 9 * * *"
  max_findings_per_domain: 10
  highlight_threshold: 0.7
  max_highlights: 5
  web_search_provider: "tavily"
  report_style: "academic-researcher"
