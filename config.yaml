# Emergent Runtime Configuration
# Non-secret settings. Secrets go in .env

agent:
  # Provider registry (non-secret; API keys come from .env)
  providers:
    anthropic:
      api_key_env: "ANTHROPIC_API_KEY"
    openrouter:
      api_key_env: "OPENROUTER_API_KEY"
      base_url: "https://openrouter.ai/api/v1"
    ollama:
      base_url: "http://127.0.0.1:11434"

  # Routing toggle. If false, runtime always uses models.default
  routing_enabled: true

  # Model tiers used by runtime routing
  models:
    fast:
      provider: "anthropic"
      model: "claude-haiku-4-5-20251001"
      max_tokens: 2048
      input_per_mtok: 1.0
      output_per_mtok: 5.0

    default:
      provider: "anthropic"
      model: "claude-haiku-4-5-20251001"
      max_tokens: 4096
      input_per_mtok: 1.0
      output_per_mtok: 5.0

    strong:
      provider: "anthropic"
      model: "claude-sonnet-4-6"
      max_tokens: 8192
      input_per_mtok: 3.0
      output_per_mtok: 15.0

    summary:
      provider: "ollama"
      model: "qwen2.5:7b"
      max_tokens: 300
      input_per_mtok: 0.0
      output_per_mtok: 0.0

  # Guards — hardcoded, NOT overridable by the agent
  # These values are used by verify_guards_integrity() at startup
  max_iterations: 15
  max_tokens_session: 100000
  timeout_per_tool_seconds: 30
  timeout_session_seconds: 300
  max_tool_output_chars: 10000
  confirmation_timeout_seconds: 60

system_prompt: |
  Sos Emergent, un agente autónomo personal corriendo en el sistema local de tu dueño.
  Tenés acceso a herramientas para ejecutar comandos de shell, leer y escribir archivos,
  obtener información del sistema, buscar en la web, y gestionar tu memoria.

  Principios:
  - Sé conciso y directo. El usuario te habla desde Telegram.
  - Antes de ejecutar comandos destructivos, explicá qué vas a hacer.
  - Usa tu memoria para recordar preferencias y contexto previo.
  - Si no podés hacer algo por seguridad, explicá por qué claramente.
  - Respondé en el mismo idioma que el usuario.

tools:
  shell:
    enabled: true
    default_timeout: 30
  files:
    enabled: true
    sandbox_root: "~"  # all paths relative to $HOME
  web:
    enabled: true
    timeout: 15
    max_chars: 10000
  system_info:
    enabled: true
    cache_ttl_seconds: 30
  memory:
    enabled: true
  cron:
    enabled: true
    min_interval_minutes: 5

memory:
  data_dir: "./data"
  sqlite_db: "emergent.db"
  chroma_dir: "chroma"
  conversation_ttl_days: 90
  trace_ttl_days: 30
  summarize_at_pct: 0.80  # trigger summarization at 80% of context budget
  context_budget_tokens: 20000

observability:
  log_level: "INFO"
  log_format: "json"  # "json" | "console"
  metrics_retention_days: 30
  alert_success_rate_critical: 0.75
  alert_p95_latency_critical: 60
  alert_cost_per_request_warning: 0.08

voice:
  enabled: false
  # Global key name (keyboard lib): e.g. f24, f13, pause, or a single char like "v"
  ptt_key: "f24"
  # Optional: exact physical key by scan code (recommended for rare keys like volume)
  # ptt_scan_code: 115
  sample_rate: 16000
  channels: 1
  max_record_seconds: 15
  stt_model: "small"
  stt_device: "cpu"
  stt_compute_type: "int8"
  stt_language: "es"
  tts_enabled: false
  tts_command: "piper"
  # Absolute path to Piper .onnx voice model
  tts_model_path: ""
  # Optional for multi-speaker models
  # tts_speaker_id: 0
  tts_length_scale: 1.0
  tts_noise_scale: 0.667
  tts_noise_w: 0.8
  tts_sentence_silence: 0.15
  tts_max_chars: 500
  ui_beep: false
